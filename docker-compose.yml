# ===========================================
# Puks AI - Docker Compose Configuration
# ===========================================

version: '3.8'

services:
  puks-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: puks-ai
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      # Mount secrets for local development
      - ./.streamlit:/app/.streamlit:ro
      # Optional: Mount data directory for updates
      # - ./DATA:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Add Redis for caching (future enhancement)
#  redis:
#    image: redis:alpine
#    container_name: puks-ai-redis
#    ports:
#      - "6379:6379"
#    restart: unless-stopped

networks:
  default:
    name: puks-ai-network
